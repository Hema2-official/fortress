name: Build public Chromium engine
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # Dedicated builder: >=200 GiB free, Chromium build dependencies, no member sandbox.
    runs-on: [self-hosted, linux, x64, chromium-builder]
    timeout-minutes: 720
    env:
      BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Chromium with public Fortress patches
        run: build/build.sh "$RUNNER_TEMP/fortress-build"
      - name: Verify native engine version
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat CHROMIUM_VERSION)"
          actual="$("$RUNNER_TEMP/fortress-build/chromium/src/out/Fortress/chrome" --version)"
          [[ "$actual" == *" $expected"* ]]
          printf '%s\n' "$actual"
      - name: Assemble portable bundle
        run: packaging/build-bundle.sh "$RUNNER_TEMP/fortress-build/chromium/src/out/Fortress" fonts "$RUNNER_TEMP/fortress-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: public-chromium-linux-x64
          path: ${{ runner.temp }}/fortress-dist/
          if-no-files-found: error

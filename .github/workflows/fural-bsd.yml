name: Mirror verified BSD engine
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify and mirror the original BSD release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: rizrmd/fortress
        shell: bash
        run: |
          set -euo pipefail
          BSD_SHA=58607300e0aaaf007b5b0c8e195af60385593ffb
          TAG=fural-bsd-151.0.7908.0
          ASSET=tilion-fortress-linux-x64.tar.gz
          curl --fail --location --retry 3 "https://github.com/tiliondev/fortress/releases/download/v151.0.7908.0/$ASSET" -o "$ASSET"
          printf '%s  %s\n' 243238b2b8a8b944b7ba2b63533d2b917da7d569dcb290ce96bf28151294b873 "$ASSET" > SHA256SUMS
          sha256sum --check SHA256SUMS
          for item in LICENSE NOTICE; do
            curl --fail --location "https://raw.githubusercontent.com/rizrmd/fortress/$BSD_SHA/$item" -o "$item"
          done
          test "$(head -n 1 LICENSE)" = "BSD 3-Clause License"
          gh release create "$TAG" "$ASSET" SHA256SUMS LICENSE NOTICE --verify-tag --title "Fortress BSD / Chromium 151.0.7908.0" --notes "Unmodified BSD-era Linux engine, verified SHA-256. Source baseline: $BSD_SHA. No activation key. Fural packaging and integration live in rizrmd/fural."
